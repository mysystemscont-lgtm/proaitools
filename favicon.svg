<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0.9" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Badge -->
  <rect width="100" height="100" rx="24" fill="#070B14" />
  <rect width="98" height="98" x="1" y="1" rx="23" fill="none" stroke="url(#cyberGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Futuristic Geometric Isometric Cube / Neural Spark -->
  <g transform="translate(50, 48) scale(0.95)">
    <!-- Top Face -->
    <polygon points="0,-32 28,-16 0,0 -28,-16" fill="url(#cubeTop)" stroke="#38BDF8" stroke-width="1" />
    <!-- Left Face -->
    <polygon points="-28,-16 0,0 0,32 -28,16" fill="url(#cubeLeft)" stroke="#0284C7" stroke-width="1" />
    <!-- Right Face -->
    <polygon points="0,0 28,-16 28,16 0,32" fill="url(#cubeRight)" stroke="#8B5CF6" stroke-width="1" />
    
    <!-- Inner Neural Core / Spark -->
    <circle cx="0" cy="0" r="4.5" fill="#FFFFFF" filter="url(#neonGlow)" />
    
    <!-- Precision Circuit Nodes -->
    <circle cx="0" cy="-32" r="2.5" fill="#38BDF8" />
    <circle cx="28" cy="-16" r="2.5" fill="#818CF8" />
    <circle cx="-28" cy="-16" r="2.5" fill="#00F5FF" />
    <circle cx="0" cy="32" r="2.5" fill="#A855F7" />
    <circle cx="28" cy="16" r="2.5" fill="#C084FC" />
    <circle cx="-28" cy="16" r="2.5" fill="#38BDF8" />

    <!-- Connecting Spark Cross -->
    <path d="M0,-14 L0,14 M-14,0 L14,0" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
  </g>
</svg>